name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: ${{ github.repository_owner }}
      - run: python scripts/render_heatmap_svg.py
      - run: python scripts/render_stats_svg.py
      - run: python scripts/generate_streak_svg.py "${{ github.repository_owner }}"
      - name: Commit refreshed profile art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg stats.svg streak.svg
          if git diff --cached --quiet; then
            echo "No profile art changes."
          else
            git commit -m "chore: refresh profile art [skip ci]"
            git push
          fi
